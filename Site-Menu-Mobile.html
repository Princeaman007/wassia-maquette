<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{margin:0}
/* dynamique */
html{scroll-behavior:smooth}
header{position:sticky;top:0;z-index:30}
a,button{transition:transform .2s,box-shadow .2s,background .2s}
a[style*="background:#D4AF37"]:hover,a[style*="background:#007A4D"]:hover,a[style*="212, 175, 55"]:hover,a[style*="0, 122, 77"]:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.22)}
article{transition:transform .25s,box-shadow .25s}
article:hover{transform:translateY(-6px);box-shadow:0 16px 32px rgba(10,42,94,.16)}
@supports (animation-timeline:view()){
.rv{animation:rvk .9s ease-out backwards;animation-timeline:view();animation-range:entry 0% cover 30%}
@keyframes rvk{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}
}
.hs{display:grid;overflow:hidden}
.hs>.sl{grid-area:1/1;opacity:0;visibility:hidden;animation:hsl 21s infinite}
.hs>.sl:nth-child(2){animation-delay:7s}
.hs>.sl:nth-child(3){animation-delay:14s}
@keyframes hsl{0%{opacity:0;visibility:visible;transform:translateX(28px)}4%{opacity:1;transform:none}30%{opacity:1;visibility:visible;transform:none}34%{opacity:0;visibility:visible;transform:translateX(-28px)}35%,100%{opacity:0;visibility:hidden}}
.hd{display:flex;gap:8px;justify-content:center;padding:0 0 32px}
.hd span{height:8px;width:10px;border-radius:4px;background:#5E7BB0;animation:hdt 21s infinite}
.hd span:nth-child(2){animation-delay:7s}
.hd span:nth-child(3){animation-delay:14s}
@keyframes hdt{0%{background:#D4AF37;width:30px}33%{background:#D4AF37;width:30px}34%,100%{background:#5E7BB0;width:10px}}
.hero:hover .sl,.hero:hover .hd span{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.hs>.sl,.hd span,.rv{animation:none !important}.hs>.sl:first-child{opacity:1;visibility:visible}}
@media (max-width:860px){.sl>[style*="max-width"]{padding-top:44px !important;padding-bottom:28px !important}}
/* carrousel étapes */
.ci{position:absolute;opacity:0;pointer-events:none}
.cv{overflow:hidden;border-radius:18px}
.ct{display:flex;width:400%;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.cc{width:25%;box-sizing:border-box;padding:32px;min-height:320px;background:linear-gradient(135deg,#0A2A5E,#1C4C99);color:#fff;display:flex;flex-direction:column;gap:14px;position:relative}
#c2:checked~.cv .ct{transform:translateX(-25%)}
#c3:checked~.cv .ct{transform:translateX(-50%)}
#c4:checked~.cv .ct{transform:translateX(-75%)}
.cd{display:flex;gap:10px;justify-content:center;margin-top:18px;align-items:center}
.cd label{width:10px;height:10px;border-radius:5px;background:#B8C2D6;cursor:pointer;transition:all .3s}
#c1:checked~.cd label[for=c1],#c2:checked~.cd label[for=c2],#c3:checked~.cd label[for=c3],#c4:checked~.cd label[for=c4]{width:32px;background:#D4AF37}
.ca{position:absolute;bottom:26px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font:700 20px/44px 'Poppins',sans-serif;text-align:center;cursor:pointer}
.ca:hover{background:#D4AF37;color:#0A2A5E}
.nt{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 18px;scrollbar-width:thin}
.nt>article{flex:0 0 min(360px,84%);scroll-snap-align:start}

*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
</style>
